name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: devport_user
          POSTGRES_PASSWORD: devport_pass
          POSTGRES_DB: devport
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U devport_user"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          DATABASE_URL: postgresql://devport_user:devport_pass@localhost:5432/devport
          JWT_SECRET_KEY: test_secret_key_for_ci_only
          REDIS_URL: redis://localhost:6379/0
        run: pytest -v
